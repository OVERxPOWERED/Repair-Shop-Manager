name: FixPro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff, migrations, deploy check, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fixpro_db
          POSTGRES_USER: fixpro_user
          POSTGRES_PASSWORD: fixpro_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixpro_user -d fixpro_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fixpro_user:fixpro_dev_password@localhost:5432/fixpro_db
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - name: Django deploy checklist (prod settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-deploy-check-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
          ALLOWED_HOSTS: api.example.com
          DATABASE_URL: postgres://fixpro_user:fixpro_dev_password@localhost:5432/fixpro_db
          FIELD_ENCRYPTION_KEYS: E_lBh8R2Ng4NQ54ShWa8rjAInVoWMrnBfWOoJZIYGW0=
        run: python manage.py check --deploy --fail-level WARNING
      - run: pytest
      - run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint, typecheck, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Frontend dependency audit
        run: pnpm audit --prod || true

  security:
    name: Security Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E and A11y (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
